<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d8eee9">
<title>海风骑行 · Pelican Coast</title>
<style>
  :root { color-scheme: light; font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif; color: #263c3a; background: #d8eee9; }
  * { box-sizing: border-box; letter-spacing: 0; }
  body { margin: 0; }
  main { min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
  header, footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 26px 5%; }
  header { border-bottom: 1px solid #263c3a24; }
  .brand { font-size: 17px; font-weight: 700; }
  .edition { font-size: 11px; }
  .intro { text-align: center; padding: 38px 20px 0; }
  .eyebrow { font-size: 11px; margin: 0 0 12px; }
  h1 { font-size: 42px; font-weight: 500; margin: 0; }
  .subtitle { margin: 12px 0 0; font-size: 14px; color: #526c66; }
  .scene { flex: 1; display: grid; align-items: center; min-height: 320px; }
  svg { width: 100%; display: block; height: auto; max-height: 68svh; }
  footer { background: #f5f5ed; min-height: 94px; }
  .caption { font-size: 12px; line-height: 1.8; }
  .caption strong { display: block; font-size: 14px; }
  .controls { display: flex; align-items: center; gap: 16px; }
  button { border: 1px solid #263c3a40; border-radius: 50%; background: transparent; color: inherit; width: 44px; height: 44px; cursor: pointer; display: grid; place-items: center; }
  button:hover { background: #d8eee9; }
  button:focus-visible, input:focus-visible { outline: 3px solid #dc725e; outline-offset: 4px; }
  .pause-icon { height: 14px; width: 12px; border-left: 4px solid currentColor; border-right: 4px solid currentColor; }
  .paused .pause-icon { width: 0; height: 0; border: 8px solid transparent; border-right: 0; border-left: 12px solid currentColor; margin-left: 3px; }
  label { font-size: 12px; display: flex; align-items: center; gap: 10px; }
  input { width: 100px; accent-color: #376e60; }
  output { width: 32px; font-size: 12px; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.6s linear infinite; }
  .crank { transform-origin: 574px 457px; animation: spin 1.6s linear infinite; }
  .foot { transform-box: fill-box; transform-origin: center; animation: counterspin 1.6s linear infinite; }
  .rider { animation: bob .8s ease-in-out infinite; }
  .wing { transform-origin: 562px 300px; animation: flap 1.6s ease-in-out infinite; }
  .scarf { transform-origin: 593px 259px; animation: flutter .8s ease-in-out infinite; }
  .cloud { animation: drift 16s ease-in-out infinite alternate; }
  .wave { animation: drift 5s ease-in-out infinite alternate; }
  .road { animation: travel 1.6s linear infinite; }
  .paused .animated { animation-play-state: paused !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes counterspin { to { transform: rotate(-360deg); } }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(.4deg); } }
  @keyframes flap { 50% { transform: rotate(-12deg); } }
  @keyframes flutter { 50% { transform: skewY(-8deg); } }
  @keyframes drift { to { transform: translateX(28px); } }
  @keyframes travel { to { transform: translateX(-160px); } }
  @media (max-width: 600px) {
    header { padding: 20px 6%; } .edition { font-size: 9px; }
    .intro { padding-top: 36px; } h1 { font-size: 32px; }
    .scene { min-height: 340px; } .scene svg { width: 170%; max-width: none; margin-left: -35%; max-height: none; }
    footer { padding: 20px 6%; flex-wrap: wrap; } .controls { gap: 12px; }
  }
</style>
</head>

  <footer><div class="caption"><strong>海风骑行</strong>沿着海岸，慢慢来。</div><div class="controls"><button id="toggle" type="button" aria-label="暂停动画" title="暂停动画" aria-pressed="false"><span class="pause-icon" aria-hidden="true"></span></button><label for="speed">速度<input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"></label><output for="speed" id="rate">1×</output></div></footer>
</main>
<script>
  const toggle = document.querySelector('#toggle');
  const speed = document.querySelector('#speed');
  function pause(value) {
    document.body.classList.toggle('paused', value);
    toggle.setAttribute('aria-pressed', String(value));
    toggle.setAttribute('aria-label', value ? '播放动画' : '暂停动画');
    toggle.title = value ? '播放动画' : '暂停动画';
  }
  toggle.addEventListener('click', () => pause(!document.body.classList.contains('paused')));
  speed.addEventListener('input', () => {
    document.getAnimations().forEach(animation => animation.updatePlaybackRate(Number(speed.value)));
    document.querySelector('#rate').textContent = speed.value + '×';
  });
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  pause(reducedMotion.matches);
  reducedMotion.addEventListener('change', event => pause(event.matches));
</script>
