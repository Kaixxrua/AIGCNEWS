# Include inside the media edge server, before generic regex locations.
# The existing aigcmedia cache zone bounds storage. v1 keeps slices separate
# from historical full-response cache entries. Never key 206 by URL alone.
location ~ ^/api/media/x/img/video\.twimg\.com/.*\.mp4$ {
    limit_except GET HEAD { deny all; }
    slice 1m;
    max_ranges 1;
    proxy_cache aigcmedia;
    proxy_cache_key "x-video-v1:$host:$request_uri:$slice_range";
    proxy_cache_valid 200 206 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_bypass 0;
    proxy_no_cache 0;
    proxy_cache_lock on;
    proxy_cache_lock_age 150s;
    proxy_cache_lock_timeout 150s;
    # Slice subrequests must carry Range, including when serving stale data.
    proxy_cache_background_update off;
    proxy_force_ranges on;
    proxy_set_header Range $slice_range;
    proxy_set_header If-Range "";
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_set_header Host aigcnews.cn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    # Keep video egress on the application's configured Mihomo route.
    proxy_pass https://127.0.0.1:18443;
    proxy_ssl_server_name on;
    proxy_ssl_name aigcnews.cn;
    proxy_ssl_verify off; # Existing SSH tunnel with a CF Origin certificate.
    proxy_connect_timeout 10s;
    proxy_read_timeout 150s;
    add_header X-Edge-Cache $upstream_cache_status always;
}
