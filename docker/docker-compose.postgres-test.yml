services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aigcnews_test
      POSTGRES_USER: aigcnews_test
      POSTGRES_PASSWORD: aigcnews_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigcnews_test -d aigcnews_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
