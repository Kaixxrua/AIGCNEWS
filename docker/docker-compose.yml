name: docker

services:

  backend-api:
    build: ../backend
    container_name: aigc-backend
    restart: always
    ports:
      # 仅绑定回环地址：公网/LAN 访问必须经 nginx（TLS+安全控制），
      # 本机调试仍可用 http://127.0.0.1:8000。
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      project-catalog-postgres:
        condition: service_healthy
    # .env 只存在于部署主机（已被 gitignore）；required: false 使干净检出
    # （CI compose-smoke、归档验证）可以校验配置，部署时仍照常读取。
    env_file:
      - path: ../.env
        required: false
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_OFFLINE=0
      - TRANSFORMERS_OFFLINE=0
      # 与镜像内 HF_HOME 一致；下方挂载点必须保持同一路径
      - HF_HOME=/hf-cache
      - OUTBOUND_PROXY=${OUTBOUND_PROXY:-socks5h://10.20.0.1:1080}
      - HTTP_PROXY=${OUTBOUND_PROXY:-socks5h://10.20.0.1:1080}
      - HTTPS_PROXY=${OUTBOUND_PROXY:-socks5h://10.20.0.1:1080}
      - ALL_PROXY=${OUTBOUND_PROXY:-socks5h://10.20.0.1:1080}
      - http_proxy=${OUTBOUND_PROXY:-socks5h://10.20.0.1:1080}
      - https_proxy=${OUTBOUND_PROXY:-socks5h://10.20.0.1:1080}
      - all_proxy=${OUTBOUND_PROXY:-socks5h://10.20.0.1:1080}
      - NO_PROXY=127.0.0.1,localhost,::1,backend-api,aigc-backend,project-catalog-postgres,redis,redis-aigc,milvus,milvus-standalone,etcd,minio,neo4j,attu,dailyhot,host.docker.internal
      - no_proxy=127.0.0.1,localhost,::1,backend-api,aigc-backend,project-catalog-postgres,redis,redis-aigc,milvus,milvus-standalone,etcd,minio,neo4j,attu,dailyhot,host.docker.internal
    extra_hosts:
      - "host.docker.internal:172.19.0.1"
    volumes:
      - ../backend:/src/backend
      - ../storage/papers:/src/storage/papers
      # MCP 工具调用计数持久化（uid 1000 写入；首次部署前宿主机预建并属主 1000）
      - ../storage/metrics:/src/storage/metrics
      # X 视频封面抽帧缓存（uid 1000 写入；首次部署前宿主机预建并属主 1000）
      - ../storage/x_media:/src/storage/x_media
      # 微信公众号图片代理缓存（uid 1000 写入；首次部署前宿主机预建并属主 1000）
      - ../storage/wechat:/src/storage/wechat
      # 容器以非 root（uid 1000）运行，缓存挂在镜像声明的 HF_HOME
      - ../storage/hf_cache/huggingface:/hf-cache
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 18
      start_period: 30s

  project-catalog-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:?set POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # 仅绑定回环：供宿主机定时备份脚本（pg_dump/psql 校验）直连，不公网暴露
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - project_catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  project-catalog-ops:
    build: ../backend
    profiles: ["project-catalog-ops"]
    env_file:
      - path: ../.env
        required: false
    working_dir: /src
    volumes:
      - ../backend:/src/backend:ro
      - ../scripts:/src/scripts:ro
    security_opt:
      - no-new-privileges:true

  frontend-web:
    build: ../frontend
    container_name: aigc-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend-api:
        condition: service_healthy
      priceai:
        condition: service_healthy
    volumes:
      # SSL 证书与私钥留在宿主机，只读挂载，不进镜像、不进仓库
      - ../frontend/ssl:/etc/nginx/ssl:ro
    # nginx master 需要绑定 80/443 并读取宿主证书，保留 root 启动，
    # 只授予 root-master nginx 的最小 capability 集：
    #   NET_BIND_SERVICE 绑定端口；SETUID/SETGID 派生 nginx(uid 101) worker；
    #   CHOWN 把 tmpfs 上的临时目录 chown 给 worker。
    # 根文件系统只读，CHOWN 的作用域仅限两个 tmpfs。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # DailyHot 聚合热榜上游（自托管 imsyy/DailyHotApi）：仅限编排内网，
  # 不对宿主暴露端口。部署方式见 docs/dailyhot-source.md：
  # 需与仓库同级检出 DailyHotApi 并预构建镜像（manage_main_stack.sh 为 --no-build）。
  dailyhot:
    profiles: ["dailyhot"]
    build:
      context: ../../DailyHotApi
      target: runner
    image: dailyhot-api:local
    container_name: aigc-dailyhot
    restart: unless-stopped
    expose:
      - "6688"
    environment:
      - PORT=6688
      # 内网专用上游：关闭域名限制，缓存 1 小时（默认），关闭文件日志
      - ALLOWED_DOMAIN=*
      - ALLOWED_HOST=dailyhot
      - USE_LOG_FILE=false
      - FILTER_WEIBO_ADVERTISEMENT=true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:6688/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  priceai:
    build:
      context: ../../PriceAI
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_UMAMI_ALLOWED_DOMAINS: price.gptsakura.com
    image: priceai-node-standalone:local
    container_name: priceai
    restart: unless-stopped
    init: true
    env_file:
      - path: ../../.priceai-node.env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--header=User-Agent: PriceAI-Docker-Healthcheck", "http://127.0.0.1:3000/api/deployment"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5@sha256:89b6debd43502d1088f3e02f39442fd3e951aa52bee846ed601cf4477114b89e
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z@sha256:6d770d7f255cda1f18d841ffc4365cb7e0d237f6af6a15fcdb587480cd7c3b93
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    # 仅限编排网络内部访问；调试时改用 docker compose exec/port-forward
    expose:
      - "9000"
      - "9001"
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.6@sha256:1658525cd8858683f6ba98458f4ad46e409ee75b25d609c983194ec509175267
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    expose:
      - "19530"
      - "9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4@sha256:36a242d51dbd48e75d8378cd735807502403e4040928d77e92aefc644679855f
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

  neo4j:
    container_name: neo4j
    image: neo4j:5.18.0@sha256:b018c04b0d01e7b6b3ff001d297fe2b80d0612a49516a7d20b0beb7f784994bb
    restart: unless-stopped
    # backend 通过编排网络按服务名连接，宿主机 7688/7475 保持外部兼容
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-12345678}
    volumes:
      - ../data/neo4j:/data

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis-aigc
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  redis_data:
  project_catalog_postgres_data:

