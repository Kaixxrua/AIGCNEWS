version: "3.9"

services:

  backend-api:
    build: ../backend
    container_name: aigc-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mysql-aigc
      - redis
    env_file:
      - ../.env
    environment:
      - HF_ENDPOINT=https://huggingface.co
      - HF_HUB_OFFLINE=0
      - TRANSFORMERS_OFFLINE=0
      # 通过宿主机 Clash 代理访问外网（172.18.0.1 = compose 网络网关 = 宿主机）
      - HTTP_PROXY=http://172.18.0.1:7890
      - HTTPS_PROXY=http://172.18.0.1:7890
      - http_proxy=http://172.18.0.1:7890
      - https_proxy=http://172.18.0.1:7890
      # 内网服务不走代理
      - NO_PROXY=localhost,127.0.0.1,milvus-standalone,mysql-aigc,redis,neo4j,etcd,minio,172.18.0.0/16,172.18.0.1,118.89.101.11,sub2api.aigcnews.cn
      - no_proxy=localhost,127.0.0.1,milvus-standalone,mysql-aigc,redis,neo4j,etcd,minio,172.18.0.0/16,172.18.0.1,118.89.101.11,sub2api.aigcnews.cn
    volumes:
      - ../backend:/src/backend
      - ../storage/papers:/src/storage/papers
      - ../storage/hf_cache/huggingface:/root/.cache/huggingface
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

  frontend-web:
    build: ../frontend
    container_name: aigc-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-api

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4
    ports:
      - "8001:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus

  neo4j:
    container_name: neo4j
    image: neo4j:5.18.0
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/12345678
    volumes:
      - ../data/neo4j:/data

  mysql-aigc:
    image: mysql:8.0
    container_name: mysql-aigc
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: rag_aigc
      MYSQL_USER: aigc_admin
      MYSQL_PASSWORD: Pp900900=
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb_buffer_pool_size=128M

  redis:
    image: redis:7-alpine
    container_name: redis-aigc
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:

