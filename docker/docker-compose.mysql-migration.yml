services:
  mysql-migration-ops:
    build:
      context: ../backend
      dockerfile: Dockerfile.migration
    profiles: ["mysql-migration"]
    env_file:
      - ../.env
    working_dir: /src
    volumes:
      - ../backend:/src/backend:ro
      - ../scripts:/src/scripts:ro
      - ../migration-artifacts:/artifacts
    security_opt:
      - no-new-privileges:true
