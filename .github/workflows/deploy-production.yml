name: Deploy Production
run-name: "production-source:${{ github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows: ["Contract Baseline"]
    types: [completed]

permissions:
  contents: read

# Keep the active production candidate running, but retain only the newest
# pending main candidate before any image build starts. Non-main workflow_run
# events use an isolated group so their skipped jobs cannot evict a deployment.
concurrency:
  group: >-
    ${{ github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        'aigcnews-production-latest' ||
        format('aigcnews-production-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, aigcnews-control]
    outputs:
      eligible: ${{ steps.candidate.outputs.eligible }}
      backend: ${{ steps.names.outputs.backend }}
      mcp: ${{ steps.names.outputs.mcp }}
      frontend: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: candidate
        name: Reject stale candidates before building images
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          latest=$(git rev-parse origin/main)
          if [[ "$SOURCE_SHA" == "$latest" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$SOURCE_SHA" "$latest"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Candidate is superseded by main $latest; no images will be built."
          else
            echo "Candidate is not in the current main lineage" >&2
            exit 1
          fi
      - id: names
        name: Normalize package names
        shell: bash
        run: |
          repository=${GITHUB_REPOSITORY,,}
          echo "backend=ghcr.io/$repository/backend" >> "$GITHUB_OUTPUT"
          echo "mcp=ghcr.io/$repository/mcp" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$repository/frontend" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: metadata
    if: needs.metadata.outputs.eligible == 'true'
    runs-on: [self-hosted, linux, aigcnews-production]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          # The trusted production runner retains Docker's local build cache.
          # Load the exact digest here; deployment uses the same Docker daemon.
          builder: default
          load: true
          provenance: false
          context: backend
          push: false
          tags: ${{ needs.metadata.outputs.backend }}:${{ github.event.workflow_run.head_sha }}

  build-mcp:
    needs: metadata
    if: needs.metadata.outputs.eligible == 'true'
    runs-on: [self-hosted, linux, aigcnews-production]
    env:
      PRODUCTION_ROOT: ${{ vars.AIGCNEWS_PRODUCTION_ROOT }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Inject the production UI catalog
        shell: bash
        run: |
          if [[ -z "$PRODUCTION_ROOT" || "$PRODUCTION_ROOT" != /* ]]; then
            echo "AIGCNEWS_PRODUCTION_ROOT must be an absolute path" >&2
            exit 1
          fi
          mkdir -p mcp-go/internal/uicatalog/data
          cp -a "$PRODUCTION_ROOT/mcp-go/internal/uicatalog/data/." mcp-go/internal/uicatalog/data/
      - id: build
        uses: docker/build-push-action@v6
        with:
          builder: default
          load: true
          provenance: false
          context: .
          file: mcp-go/Dockerfile
          push: false
          tags: ${{ needs.metadata.outputs.mcp }}:${{ github.event.workflow_run.head_sha }}
          # 生产 runner 无法直连 proxy.golang.org；按 mcp-go/Dockerfile 预留的
          # GOPROXY 出口改用境内镜像源，避免 go mod download 确定性超时。
          build-args: |
            GOPROXY=https://goproxy.cn,direct

  build-frontend:
    needs: metadata
    if: needs.metadata.outputs.eligible == 'true'
    runs-on: [self-hosted, linux, aigcnews-production]
    env:
      PRODUCTION_ROOT: ${{ vars.AIGCNEWS_PRODUCTION_ROOT }}
      PRIVATE_FRONTEND_ROOT: ${{ vars.AIGCNEWS_GODOT_RELEASE_ROOT }}
      PRIVATE_FRONTEND_RELEASE_ID: ${{ vars.AIGCNEWS_GODOT_RELEASE_ID }}
      PRIVATE_FRONTEND_DESCRIPTOR_SHA256: ${{ vars.AIGCNEWS_GODOT_RELEASE_DESCRIPTOR_SHA256 }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Inject the production UI catalog and private frontend
        shell: bash
        run: |
          if [[ -z "$PRODUCTION_ROOT" || "$PRODUCTION_ROOT" != /* ]]; then
            echo "AIGCNEWS_PRODUCTION_ROOT must be an absolute path" >&2
            exit 1
          fi
          if [[ -z "$PRIVATE_FRONTEND_ROOT" || "$PRIVATE_FRONTEND_ROOT" != /* ]]; then
            echo "AIGCNEWS_GODOT_RELEASE_ROOT must be an absolute path" >&2
            exit 1
          fi
          if [[ -z "$PRIVATE_FRONTEND_RELEASE_ID" ]]; then
            echo "AIGCNEWS_GODOT_RELEASE_ID must pin an immutable private release" >&2
            exit 1
          fi
          if [[ ! "$PRIVATE_FRONTEND_DESCRIPTOR_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "AIGCNEWS_GODOT_RELEASE_DESCRIPTOR_SHA256 must be a lowercase SHA-256 digest" >&2
            exit 1
          fi
          mkdir -p frontend/.ui-library-data frontend/.ui-previews/previews
          cp -a "$PRODUCTION_ROOT/mcp-go/internal/uicatalog/data/." frontend/.ui-library-data/
          cp -a "$PRODUCTION_ROOT/frontend/.ui-previews/previews/." frontend/.ui-previews/previews/
          python3 scripts/release/stage_private_frontend.py \
            --private-root "$PRIVATE_FRONTEND_ROOT" \
            --frontend-root frontend \
            --expected-release-id "$PRIVATE_FRONTEND_RELEASE_ID" \
            --expected-descriptor-sha256 "$PRIVATE_FRONTEND_DESCRIPTOR_SHA256"
      - name: Validate the protected frontend overlay
        working-directory: frontend
        shell: bash
        env:
          # uiLibraryAssets() 默认读取 ../mcp-go/internal/uicatalog/data（仅 build-mcp
          # 注入）；本 job 的生产目录注入在 frontend/.ui-library-data，显式指过去，
          # 让 vitest 校验真实覆盖层而不是找不到 catalog.json。
          UI_LIBRARY_DATA_ROOT: ${{ github.workspace }}/frontend/.ui-library-data
        run: |
          npm ci
          npm run typecheck
          npm run test:unit -- \
            src/components/contact/GodotContactScene.test.ts \
            src/views/ContactPageView.test.ts
      - id: build
        uses: docker/build-push-action@v6
        with:
          builder: default
          load: true
          provenance: false
          context: frontend
          push: false
          tags: ${{ needs.metadata.outputs.frontend }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: [metadata, build-backend, build-mcp, build-frontend]
    runs-on: [self-hosted, linux, aigcnews-production]
    timeout-minutes: 30
    environment: production
    env:
      PRODUCTION_ROOT: ${{ vars.AIGCNEWS_PRODUCTION_ROOT }}
    steps:
      - name: Require unattended deployment configuration
        shell: bash
        run: |
          if [[ -z "$PRODUCTION_ROOT" || "$PRODUCTION_ROOT" != /* ]]; then
            echo "Repository variable AIGCNEWS_PRODUCTION_ROOT must be an absolute path" >&2
            exit 1
          fi

      - name: Check out the trusted deployment controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Apply immutable release under host lock
        shell: bash
        run: |
          python3 scripts/release/deploy_production.py \
            --root "$PRODUCTION_ROOT" \
            --source-sha "${{ github.event.workflow_run.head_sha }}" \
            --backend-image "${{ needs.metadata.outputs.backend }}@${{ needs.build-backend.outputs.digest }}" \
            --mcp-image "${{ needs.metadata.outputs.mcp }}@${{ needs.build-mcp.outputs.digest }}" \
            --frontend-image "${{ needs.metadata.outputs.frontend }}@${{ needs.build-frontend.outputs.digest }}"
