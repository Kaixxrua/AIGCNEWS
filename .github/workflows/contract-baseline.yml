name: Contract Baseline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-baseline-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest>=8.2,<9"

      # Several legacy tests install process-global module stubs during import.
      # Isolate files until those stubs are replaced with scoped fixtures.
      - name: Run committed backend tests in isolation
        shell: bash
        run: |
          while IFS= read -r test_file; do
            python -m pytest -q -p langchain_core.documents "$test_file" || exit 1
          done < <(git ls-tree -r --name-only HEAD -- 'backend/tests/test_*.py')

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aigcnews_test
          POSTGRES_USER: aigcnews_test
          POSTGRES_PASSWORD: aigcnews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigcnews_test -d aigcnews_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://aigcnews_test:aigcnews_test@127.0.0.1:5432/aigcnews_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: aigcnews_test
      POSTGRES_PASSWORD: aigcnews_test
      POSTGRES_DATABASE: aigcnews_test
      POSTGRES_SSLMODE: disable
      POSTGRES_POOL_MIN_SIZE: "1"
      POSTGRES_POOL_MAX_SIZE: "4"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest>=8.2,<9"

      - name: Validate project-catalog rehearsal configuration
        env:
          REHEARSAL_BACKEND_IMAGE: ghcr.io/example/aigcnews-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/aigcnews-rehearsal.env
          REHEARSAL_MYSQL_ROOT_PASSWORD: ci-placeholder-not-used
          REHEARSAL_MYSQL_DATABASE: aigcnews_rehearsal
          REHEARSAL_MYSQL_USER: aigcnews_rehearsal
          REHEARSAL_MYSQL_PASSWORD: ci-placeholder-not-used
          REHEARSAL_POSTGRES_DATABASE: aigcnews_rehearsal
          REHEARSAL_POSTGRES_USER: aigcnews_rehearsal
          REHEARSAL_POSTGRES_PASSWORD: ci-placeholder-not-used
          REHEARSAL_MINIO_ROOT_USER: aigcnews-rehearsal
          REHEARSAL_MINIO_ROOT_PASSWORD: ci-placeholder-not-used
        run: |
          install -m 600 /dev/null "$REHEARSAL_ENV_FILE"
          scripts/rehearse_project_catalog_cutover.sh config
          python -m pytest -q backend/tests/test_project_catalog_rehearsal_config.py

      - name: Apply PostgreSQL migrations explicitly
        run: python scripts/migrate_postgres.py apply

      # Keep these files in separate processes because legacy tests install global stubs.
      - name: Verify PostgreSQL migrations and trigram indexes
        run: >-
          python -m pytest -q -p langchain_core.documents
          backend/tests/test_postgres_migrations.py

      - name: Run PostgreSQL catalog integration test
        run: >-
          python -m pytest -q -p langchain_core.documents
          backend/tests/test_postgres_project_catalog_integration.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
