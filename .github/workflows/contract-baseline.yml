name: Contract Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest>=8.2,<9"

      # Several legacy tests install process-global module stubs during import.
      # Isolate files until those stubs are replaced with scoped fixtures.
      - name: Run committed backend tests in isolation
        shell: bash
        run: |
          while IFS= read -r test_file; do
            python -m pytest -q -p langchain_core.documents "$test_file" || exit 1
          done < <(git ls-tree -r --name-only HEAD -- 'backend/tests/test_*.py')

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
