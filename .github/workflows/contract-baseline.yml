name: Contract Baseline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-baseline-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify dependency lock consistency
        run: |
          python -m pip install --upgrade pip uv
          uv pip compile backend/requirements.txt \
            --constraint backend/requirements.lock \
            --python-version 3.12 -o /tmp/check.lock
          diff \
            <(grep -vE '^\s*#|^\s*$' backend/requirements.lock) \
            <(grep -vE '^\s*#|^\s*$' /tmp/check.lock)

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install "pytest>=8.2,<9" "pytest-asyncio>=0.24,<2" "pytest-cov>=6,<8" "ruff>=0.16,<0.17"

      - name: Lint backend with ruff
        run: ruff check backend/app backend/tests

      # 单进程全套件已在干净检出归档上连续验证通过（1150 passed）；
      # 逐文件隔离循环与遗留进程级替身均已退役。
      # 覆盖率门禁：fail-under=70，基线来源为 2026-08-08 本地
      # backend/.venv/bin/python 以同一命令实测 TOTAL 79%，下调 9 个
      # 百分点留出波动余量；覆盖率提升后可逐步上调。
      - name: Run backend test suite
        shell: bash
        run: >-
          python -m pytest -q -p langchain_core.documents
          --cov=backend/app --cov-report=term-missing --cov-config=backend/pyproject.toml
          --cov-fail-under=70
          backend/tests

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aigcnews_test
          POSTGRES_USER: aigcnews_test
          POSTGRES_PASSWORD: aigcnews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigcnews_test -d aigcnews_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://aigcnews_test:aigcnews_test@127.0.0.1:5432/aigcnews_test
      TEST_POSTGRES_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      # Test-only 32-byte key; production secrets never enter this job.
      MCP_SERVER_ENCRYPTION_KEY: rRMcQkNlCLdB-aJue6WnZTeQ6n-HIhmbb2Qy04cW7KU=
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install "pytest>=8.2,<9"

      - name: Provision PostgreSQL test-run marker
        env:
          PGPASSWORD: aigcnews_test
        run: |
          psql "host=127.0.0.1 port=5432 user=aigcnews_test dbname=aigcnews_test sslmode=disable" \
            -v ON_ERROR_STOP=1 -v run_id="$TEST_POSTGRES_RUN_ID" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA public;
          CREATE TABLE IF NOT EXISTS public.aigcnews_test_run_guard (
              run_id TEXT PRIMARY KEY,
              created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO public.aigcnews_test_run_guard (run_id) VALUES (:'run_id');
          SQL

      # Integration suites share one PostgreSQL service container, so they run
      # file-isolated to avoid cross-suite database state leakage.
      - name: Verify PostgreSQL migrations and trigram indexes
        run: >-
          python -m pytest -q -p langchain_core.documents
          backend/tests/test_postgres_migrations.py

      - name: Run PostgreSQL catalog integration test
        run: >-
          python -m pytest -q -p langchain_core.documents
          backend/tests/test_postgres_project_catalog_integration.py

      # Same shared-database reason as above: file isolation, not stub defense.
      - name: Run gated PostgreSQL repository integration suites
        shell: bash
        run: |
          while IFS= read -r test_file; do
            python -m pytest -q -p langchain_core.documents "$test_file" || exit 1
          done <<'EOF'
          backend/tests/test_postgres_user_account_repository_integration.py
          backend/tests/test_postgres_payment_order_repository_integration.py
          backend/tests/test_postgres_conversation_repository_integration.py
          backend/tests/test_postgres_attachment_repository_integration.py
          backend/tests/test_postgres_attachment_meta_repository_integration.py
          backend/tests/test_postgres_mcp_repositories_integration.py
          backend/tests/test_postgres_config_repositories_integration.py
          backend/tests/test_postgres_runtime_repositories_integration.py
          backend/tests/test_postgres_project_ingestion_adapter_integration.py
          backend/tests/test_postgres_project_write_adapter_integration.py
          backend/tests/test_postgres_project_enrichment_adapters_pg16_integration.py
          backend/tests/test_postgres16_github_project_semantic_source_integration.py
          backend/tests/test_postgres_push_repositories_integration.py
          backend/tests/test_postgres_document_repository_integration.py
          backend/tests/test_postgres_github_rename_reconcile_integration.py
          backend/tests/test_postgres_x_translation_repository_integration.py
          EOF

  mcp-go:
    name: MCP Go build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-go
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Verify go.mod/go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Materialize clean-checkout UI catalog fixture
        run: python ../scripts/ci/materialize_ui_catalog_fixture.py

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 探活端点测试直接回放 backend/tests/parity 黄金语料（字节级硬门禁）
      - name: Test (parity corpus gate included)
        run: go test ./... -count=1

  compose-smoke:
    name: Compose and image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DATABASE: ci_placeholder
      POSTGRES_USER: ci_placeholder
      POSTGRES_PASSWORD: ci_placeholder
      NEO4J_PASSWORD: ci_placeholder
      MINIO_ACCESS_KEY: ci_placeholder
      MINIO_SECRET_KEY: ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate main compose file
        run: docker compose --file docker/docker-compose.yml config --quiet

      - name: Validate backup-test compose file
        run: |
          mkdir -p "$RUNNER_TEMP/backup-artifacts"
          AIGCNEWS_PROJECT_ROOT="$GITHUB_WORKSPACE" \
          AIGCNEWS_BACKUP_ARTIFACTS="$RUNNER_TEMP/backup-artifacts" \
            docker compose --file docker/docker-compose.postgres-backup-test.yml config --quiet

      - name: Validate digest-only staging compose file
        env:
          AIGCNEWS_STAGING_BACKEND_IMAGE_DIGEST: example/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AIGCNEWS_STAGING_MCP_IMAGE_DIGEST: example/mcp@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          AIGCNEWS_STAGING_FRONTEND_IMAGE_DIGEST: example/frontend@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          POSTGRES_USER: staging
          POSTGRES_PASSWORD: staging
          POSTGRES_DATABASE: staging
        run: docker compose --file deploy/staging/docker-compose.yml config --quiet

      - name: Materialize clean-checkout UI catalog fixture
        run: python scripts/ci/materialize_ui_catalog_fixture.py --frontend-copy

      # The frontend image must build from a clean checkout: SSL material is
      # gitignored and mounted at runtime, never copied into the image.
      - name: Build frontend image from clean checkout
        run: docker build --tag aigcnews-frontend-ci frontend/

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Materialize clean-checkout UI catalog fixture
        run: python ../scripts/ci/materialize_ui_catalog_fixture.py

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
