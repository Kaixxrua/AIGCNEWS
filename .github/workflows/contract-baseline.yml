name: Contract Baseline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-baseline-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify dependency lock consistency
        run: |
          python -m pip install --upgrade pip uv
          uv pip compile backend/requirements.txt \
            --constraint backend/requirements.lock \
            --python-version 3.12 -o /tmp/check.lock
          diff \
            <(grep -vE '^\s*#|^\s*$' backend/requirements.lock) \
            <(grep -vE '^\s*#|^\s*$' /tmp/check.lock)

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install "pytest>=8.2,<9" "pytest-cov>=6,<8" "ruff>=0.16,<0.17"

      - name: Lint backend with ruff
        run: ruff check backend/app backend/tests

      # 单进程全套件已在干净检出归档上连续验证通过（1150 passed）；
      # 逐文件隔离循环与遗留进程级替身均已退役。
      # 覆盖率仅上报 term-missing，暂不设阈值门禁。
      - name: Run backend test suite
        shell: bash
        run: >-
          python -m pytest -q -p langchain_core.documents
          --cov=backend/app --cov-report=term-missing --cov-config=backend/pyproject.toml
          backend/tests

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aigcnews_test
          POSTGRES_USER: aigcnews_test
          POSTGRES_PASSWORD: aigcnews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigcnews_test -d aigcnews_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://aigcnews_test:aigcnews_test@127.0.0.1:5432/aigcnews_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: aigcnews_test
      POSTGRES_PASSWORD: aigcnews_test
      POSTGRES_DATABASE: aigcnews_test
      POSTGRES_DB: aigcnews_test
      POSTGRES_SSLMODE: disable
      POSTGRES_POOL_MIN_SIZE: "1"
      POSTGRES_POOL_MAX_SIZE: "4"
      POSTGRES_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest>=8.2,<9"

      - name: Validate project-catalog rehearsal configuration
        env:
          REHEARSAL_BACKEND_IMAGE: ghcr.io/example/aigcnews-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REHEARSAL_RELEASE_ID: ci-${{ github.sha }}
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/aigcnews-rehearsal.env
          REHEARSAL_MYSQL_ROOT_PASSWORD: ci-placeholder-not-used
          REHEARSAL_MYSQL_DATABASE: aigcnews_rehearsal
          REHEARSAL_MYSQL_USER: aigcnews_rehearsal
          REHEARSAL_MYSQL_PASSWORD: ci-placeholder-not-used
          REHEARSAL_POSTGRES_DATABASE: aigcnews_rehearsal
          REHEARSAL_POSTGRES_USER: aigcnews_rehearsal
          REHEARSAL_POSTGRES_PASSWORD: ci-placeholder-not-used
          REHEARSAL_MINIO_ROOT_USER: aigcnews-rehearsal
          REHEARSAL_MINIO_ROOT_PASSWORD: ci-placeholder-not-used
        run: |
          install -m 600 /dev/null "$REHEARSAL_ENV_FILE"
          scripts/rehearse_project_catalog_cutover.sh config
          python -m pytest -q backend/tests/test_project_catalog_rehearsal_config.py

      - name: Apply PostgreSQL migrations explicitly
        run: python scripts/migrate_postgres.py apply

      # Integration suites share one PostgreSQL service container, so they run
      # file-isolated to avoid cross-suite database state leakage.
      - name: Verify PostgreSQL migrations and trigram indexes
        run: >-
          python -m pytest -q -p langchain_core.documents
          backend/tests/test_postgres_migrations.py

      - name: Run PostgreSQL catalog integration test
        run: >-
          python -m pytest -q -p langchain_core.documents
          backend/tests/test_postgres_project_catalog_integration.py

      # Same shared-database reason as above: file isolation, not stub defense.
      - name: Run gated PostgreSQL repository integration suites
        shell: bash
        run: |
          while IFS= read -r test_file; do
            python -m pytest -q -p langchain_core.documents "$test_file" || exit 1
          done <<'EOF'
          backend/tests/test_postgres_user_account_repository_integration.py
          backend/tests/test_postgres_conversation_repository_integration.py
          backend/tests/test_postgres_attachment_repository_integration.py
          backend/tests/test_postgres_mcp_repositories_integration.py
          backend/tests/test_application_transfer_service_integration.py
          backend/tests/test_table_transfer_reconciliation_postgresql16_integration.py
          EOF

  compose-smoke:
    name: Compose and image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DATABASE: ci_placeholder
      POSTGRES_USER: ci_placeholder
      POSTGRES_PASSWORD: ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate main compose file
        run: docker compose --file docker/docker-compose.yml config --quiet

      - name: Validate backup-test compose file
        run: |
          mkdir -p "$RUNNER_TEMP/backup-artifacts"
          AIGCNEWS_PROJECT_ROOT="$GITHUB_WORKSPACE" \
          AIGCNEWS_BACKUP_ARTIFACTS="$RUNNER_TEMP/backup-artifacts" \
            docker compose --file docker/docker-compose.postgres-backup-test.yml config --quiet

      # The frontend image must build from a clean checkout: SSL material is
      # gitignored and mounted at runtime, never copied into the image.
      - name: Build frontend image from clean checkout
        run: docker build --tag aigcnews-frontend-ci frontend/

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
