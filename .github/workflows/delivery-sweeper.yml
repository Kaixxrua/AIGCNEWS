name: Delivery Sweeper

on:
  workflow_run:
    workflows: ["Session PR", "Contract Baseline"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: aigcnews-delivery-sweeper
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconcile exact-head session deliveries
        env:
          # A repository-owner token is required to approve bot-authored runs.
          # It is exposed only to this default-branch workflow, never to PR jobs.
          GH_TOKEN: ${{ secrets.AIGCNEWS_DELIVERY_TOKEN }}
        run: python3 scripts/ci/delivery_sweeper.py --apply
