name: Auto Merge Validated Session PR

on:
  workflow_run:
    workflows: ["Contract Baseline"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

# Use the same lock and reconciliation code as scheduled recovery.
concurrency:
  group: aigcnews-delivery-sweeper
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'session/')
    runs-on: [self-hosted, linux, aigcnews-control]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconcile through the single landing controller
        env:
          GH_TOKEN: ${{ secrets.AIGCNEWS_DELIVERY_TOKEN }}
        run: python3 scripts/ci/delivery_sweeper.py --apply
