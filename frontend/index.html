<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f5ee" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 桌面每页都用的 DM Sans 400/700/800 随 HTML 一起请求。等应用首帧渲染时才发现它们就晚了：字体换上后，
         简报控制条、MCP 页头会重新折行，造成布局偏移（见 docs/layout-budget.md）。手机版正文用 Inter（mobile-reading.css），
         所以只在 768px 以上预加载。媒体条件按当时的视口算，这几行要排在 viewport 声明之后，否则手机按默认的 980px 宽也会命中。
         字体同源，但仍须带 crossorigin，否则预加载用不上。 -->
    <link rel="preload" href="/fonts/dm-sans-v17-latin_latin-ext-regular.woff2" as="font" type="font/woff2" media="(min-width: 768px)" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-v17-latin_latin-ext-700.woff2" as="font" type="font/woff2" media="(min-width: 768px)" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-v17-latin_latin-ext-800.woff2" as="font" type="font/woff2" media="(min-width: 768px)" crossorigin />
    <meta name="description" content="AIGCNEWS（AIGC Radar）：AI 垂直资讯索引——arXiv 论文、GitHub AI 项目库、日/周/月榜单与每日简报。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AIGCNEWS · AIGC Radar" />
    <meta property="og:description" content="AI 垂直资讯索引：arXiv 论文、GitHub AI 项目库、日/周/月榜单与每日简报。" />
    <meta property="og:url" content="https://aigcnews.cn" />
    <meta property="og:image" content="https://aigcnews.cn/logo.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aigcnews.cn/#org",
            "name": "AIGCNEWS",
            "alternateName": ["AIGC News", "AIGC Radar", "AIGC 资讯"],
            "url": "https://aigcnews.cn/",
            "logo": "https://aigcnews.cn/logo.png",
            "sameAs": ["https://github.com/Kaixxrua/AIGCNEWS"]
          },
          {
            "@type": "WebSite",
            "@id": "https://aigcnews.cn/#site",
            "url": "https://aigcnews.cn/",
            "name": "AIGCNEWS",
            "alternateName": ["AIGC News", "AIGC 资讯"],
            "publisher": { "@id": "https://aigcnews.cn/#org" },
            "inLanguage": "zh-CN"
          }
        ]
      }
    </script>
    <link rel="alternate" type="application/rss+xml" title="AIGCNEWS" href="/api/feed.xml" />
    <script>
      // 与 src/theme/theme.ts 的 resolveAppTheme 保持同步：存储值 → 系统偏好 → 浅色。
      (function () {
        try {
          var t = localStorage.getItem('app_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) { /* 存储被禁用时默认浅色 */ }
      })();
    </script>
    <title>AIGCNEWS · AIGC Radar — arXiv 论文、GitHub AI 项目、榜单与每日简报</title>
  </head>
  <body>
    <div id="app"></div>

  </body>
