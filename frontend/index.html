<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f5ee" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AIGCNEWS（AIGC Radar）：AI 垂直资讯索引——arXiv 论文、GitHub AI 项目库、日/周/月榜单与每日简报。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AIGCNEWS · AIGC Radar" />
    <meta property="og:description" content="AI 垂直资讯索引：arXiv 论文、GitHub AI 项目库、日/周/月榜单与每日简报。" />
    <meta property="og:url" content="https://aigcnews.cn" />
    <meta property="og:image" content="https://aigcnews.cn/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="alternate" type="application/rss+xml" title="AIGCNEWS" href="/api/feed.xml" />
    <script>
      // 与 src/theme/theme.ts 的 resolveAppTheme 保持同步：存储值 → 系统偏好 → 浅色。
      (function () {
        try {
          var t = localStorage.getItem('app_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) { /* 存储被禁用时默认浅色 */ }
      })();
    </script>
    <title>AIGCNEWS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
