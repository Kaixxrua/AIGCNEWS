server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 确保 .mjs 文件以正确的 MIME 类型返回（ES Module Worker 必须）
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        application/pdf                       pdf;
        application/octet-stream              bin exe dll;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 的文件）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
