map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── 限流区域 ─────────────────────────────────────────────────
# 键为 $binary_remote_addr；主 server 经 real_ip 还原后是真实客户端 IP。
# api_auth：认证端点严格限流（后端另有应用层 10 次/10 分钟/IP 的精确限制）。
# api_general：API 一般端点宽松防 flood，正常 SPA 页面加载（~15 请求）不会触发。
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# 压缩文本类响应，降低家庭服务器经 WireGuard 回源的传输量
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name aigcnews.cn www.aigcnews.cn;
    return 301 https://$host$request_uri;
}

# sub2api HTTP → HTTPS 重定向
server {
    listen 80;
    server_name sub2api.aigcnews.cn;
    return 301 https://$host$request_uri;
}

# PriceAI 由腾讯 VPS Caddy 终止公网 TLS，再通过 WireGuard 回源。
server {
    listen 80;
    server_name price.gptsakura.com;

    location / {
        proxy_pass http://priceai:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name aigcnews.cn www.aigcnews.cn;

    # ── SSL 证书 ────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/aigcnews.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/aigcnews.cn.key;

    # ── SSL 安全配置 ─────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 真实客户端 IP 还原 ──────────────────────────────────
    # 公网流量经 Cloudflare Tunnel 回源：cloudflared 以宿主机 WireGuard 地址
    # （10.20.0.1）直连本服务，边缘注入的 X-Forwarded-For 只含 CF 边缘节点 IP，
    # 真实客户端 IP 仅在 CF-Connecting-IP 中可信。直连（LAN）流量不受影响。
    set_real_ip_from 10.20.0.1;
    real_ip_header CF-Connecting-IP;

    # ── 请求体上限 ──────────────────────────────────────────
    # PDF 上传上限 50MiB（multipart 二进制直传），预留协议开销。
    client_max_body_size 60m;

    # 限流命中返回 429（默认 503 语义不符）。
    limit_req_status 429;

    # HSTS：两年期。站点已纯 HTTPS 运行稳定，开启后浏览器强制走 HTTPS。
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── 安全响应头 ──────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP（enforce）。字体已自托管，无需外部字体源；index.html 的主题引导
    # 内联脚本经 sha256 哈希白名单放行——改动该脚本必须同步更新哈希，
    # 由 frontend/tests 的 CSP 哈希契约测试守住一致性。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lpDpw24qmT9qScq5x7bCXPny3S6TkzvM+wyQBs6xxcM='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # ── MIME 类型 ────────────────────────────────────────────
    # 继承 http 上下文的标准 mime.types（原手写 types 表已删除）；
    # 唯一缺口 .mjs 由下方 /assets/*.mjs 专用 location 补充。

    # ── SPA 路由回退 ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 认证端点：严格限流 ───────────────────────────────────
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://aigc-backend:8000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 边缘 XFF 链不含真实客户端，以还原后的地址为准（后端限流按首跳取值）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 反向代理：/api → 后端容器 ────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://aigc-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（禁用缓冲，保持长连接）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── .mjs 不在标准 MIME 表：单独声明并保持长缓存 ────────────
    location ~ ^/assets/.+\.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── 静态资源长缓存（带 hash 的文件）──────────────────────
    # 本块自带 add_header，不继承 server 级安全头，需重复声明。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# sub2api HTTPS 反向代理（供本机调用，避免经 Cloudflare Tunnel 公网回环）
server {
    listen 443 ssl;
    server_name sub2api.aigcnews.cn;

    ssl_certificate     /etc/nginx/ssl/sub2api.aigcnews.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/sub2api.aigcnews.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 0;
    client_body_timeout 600s;

    location / {
        proxy_pass http://10.20.0.2:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
