map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 压缩文本类响应，降低家庭服务器经 WireGuard 回源的传输量
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name aigcnews.cn www.aigcnews.cn;
    return 301 https://$host$request_uri;
}

# sub2api HTTP → HTTPS 重定向
server {
    listen 80;
    server_name sub2api.aigcnews.cn;
    return 301 https://$host$request_uri;
}

# PriceAI 由腾讯 VPS Caddy 终止公网 TLS，再通过 WireGuard 回源。
server {
    listen 80;
    server_name price.gptsakura.com;

    location / {
        proxy_pass http://priceai:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name aigcnews.cn www.aigcnews.cn;

    # ── SSL 证书 ────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/aigcnews.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/aigcnews.cn.key;

    # ── SSL 安全配置 ─────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS（可选，首次部署建议先注释掉，稳定后再开启）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    root /usr/share/nginx/html;
    index index.html;

    # ── MIME 类型 ────────────────────────────────────────────
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        application/pdf                       pdf;
        application/octet-stream              bin exe dll;
    }

    # ── SPA 路由回退 ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 反向代理：/api → 后端容器 ────────────────────────────
    location /api/ {
        proxy_pass http://aigc-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（禁用缓冲，保持长连接）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── 静态资源长缓存（带 hash 的文件）──────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# sub2api HTTPS 反向代理（供本机调用，避免经 Cloudflare Tunnel 公网回环）
server {
    listen 443 ssl;
    server_name sub2api.aigcnews.cn;

    ssl_certificate     /etc/nginx/ssl/sub2api.aigcnews.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/sub2api.aigcnews.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 0;
    client_body_timeout 600s;

    location / {
        proxy_pass http://10.20.0.2:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
