map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── Docker 内网 DNS 动态解析 ─────────────────────────────────
# 上游容器（aigc-backend / priceai）重建会分配新 IP；proxy_pass 写字面
# 主机名时 nginx 只在启动/重载时解析一次并永久缓存，上游换 IP 后全部
# connect() refused → 502（2026-08-08 实际发生）。变量化 proxy_pass +
# resolver 后按 valid TTL 重新解析；127.0.0.11 是 Docker 内嵌 DNS。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ── 限流区域 ─────────────────────────────────────────────────
# 键为 $binary_remote_addr；主 server 经 real_ip 还原后是真实客户端 IP。
# api_auth：认证端点严格限流（后端另有应用层 10 次/10 分钟/IP 的精确限制）。
# api_general：API 一般端点宽松防 flood，正常 SPA 页面加载（~15 请求）不会触发。
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# 压缩文本类响应，降低家庭服务器经 WireGuard 回源的传输量
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name aigcnews.cn www.aigcnews.cn;
    return 301 https://$host$request_uri;
}

# 其他 vhost（姊妹产品、内部服务）位于私有 server 文件，
# 由本文件末尾 include /etc/nginx/conf.d/private-servers.inc 引入（开源版为空）。

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name aigcnews.cn www.aigcnews.cn;

    # ── SSL 证书 ────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/aigcnews.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/aigcnews.cn.key;

    # ── SSL 安全配置 ─────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 真实客户端 IP 还原 ──────────────────────────────────
    # 公网流量经 Tunnel/VPN 回源时，需在私有部署提供回源地址白名单
    # （set_real_ip_from / real_ip_header）。开源版该文件为空占位，
    # 本地直连无需还原；私有部署经 compose overlay bind-mount 注入。
    include /etc/nginx/conf.d/private-server-directives.inc;

    # ── 请求体上限 ──────────────────────────────────────────
    # PDF 上传上限 50MiB（multipart 二进制直传），预留协议开销。
    client_max_body_size 60m;

    # 限流命中返回 429（默认 503 语义不符）。
    limit_req_status 429;

    # HSTS：两年期。站点已纯 HTTPS 运行稳定，开启后浏览器强制走 HTTPS。
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── 安全响应头 ──────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP（enforce）。字体已自托管，无需外部字体源；index.html 的主题引导
    # 内联脚本经 sha256 哈希白名单放行——改动该脚本必须同步更新哈希，
    # 由 frontend/tests 的 CSP 哈希契约测试守住一致性。
    # media-src 与 img-src 同 posture 放行 HTTPS：X Board 视频直连
    # video.twimg.com，缺失 media-src 会回退 default-src 'self' 被拦。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lpDpw24qmT9qScq5x7bCXPny3S6TkzvM+wyQBs6xxcM='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # 后端上游：变量化以便经 http 级 resolver 动态解析容器 IP。
    # 原映射为恒等前缀（/api/* → /api/*），$request_uri 保持原语义不变。
    set $backend_upstream http://aigc-backend:8000;
    # Go MCP 网关上游：同一变量化口径（容器重建换 IP 后经 resolver 重解析）。
    set $mcp_go_upstream http://aigc-mcp-go:8000;

    # ── MIME 类型 ────────────────────────────────────────────
    # 继承 http 上下文的标准 mime.types（原手写 types 表已删除）；
    # 唯一缺口 .mjs 由下方 /assets/*.mjs 专用 location 补充。

    # ── SPA 路由回退 ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 认证端点：严格限流 ───────────────────────────────────
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 边缘 XFF 链不含真实客户端，以还原后的地址为准（后端限流按首跳取值）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── MCP JSON-RPC：Go 网关蓝绿切流 ───────────────────────
    # 仅精确路径 /api/mcp（POST 单端点，Python 侧同为单端点挂载）；
    # 其余 /api/* 仍走下方 /api/ 块到 Python 主后端。回滚 = 删除本块
    # 并 reload，/api/mcp 自动回落 /api/ 块。限流/头/SSE 与 /api/ 逐条对齐。
    location = /api/mcp {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass $mcp_go_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 边缘 XFF 链不含真实客户端，以还原后的地址为准（与 /api/ 块同口径）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（禁用缓冲，保持长连接）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── 反向代理：/api → 后端容器 ────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（禁用缓冲，保持长连接）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── .mjs 不在标准 MIME 表：单独声明并保持长缓存 ────────────
    location ~ ^/assets/.+\.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── 静态资源长缓存（带 hash 的文件）──────────────────────
    # 本块自带 add_header，不继承 server 级安全头，需重复声明。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Versioned gallery media is immutable. The catalog changes the filename
    # whenever the pinned upstream revision changes.
    location ~ ^/ui-library/(?:posters|clips)/.+\.(?:webp|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── PWA：SW 脚本 / manifest / 入口文档禁用缓存 ─────────────
    # sw.js 的更新检查依赖字节级比对，被缓存会导致新版本永远不被发现；
    # SPA fallback 经 try_files 内部重定向命中 location = /index.html。
    # 以下块自带 add_header，不继承 server 级安全头，需重复声明（同
    # /assets/ 块口径）。workbox-*.js 等带 hash 文件由 /assets/ 块覆盖，
    # 无需处理。
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # 本块自带 add_header 后不继承 server 级响应头。index.html 是文档
        # 本体——CSP 只挂在文档响应上才生效，HSTS 亦在此重复声明；与 server
        # 级字符串必须逐字一致，由 pwaNginxContract 测试守漂移。
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lpDpw24qmT9qScq5x7bCXPny3S6TkzvM+wyQBs6xxcM='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# ── 私有 server 块引入 ─────────────────────────────────────────
# 开源版为空占位文件（仅注释）；私有部署经 compose overlay bind-mount
# 注入姊妹产品/内部服务 vhost。文件缺失会导致 nginx 启动失败，
# 因此镜像内置占位文件（Dockerfile COPY），bind-mount 仅做覆盖。
include /etc/nginx/conf.d/private-servers.inc;
