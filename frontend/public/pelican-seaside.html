<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dcedea">
  <title>Coasting. - A Pelican's Seaside Ride</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #244943; background: #f8faf4; letter-spacing: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { height: 100svh; min-height: 580px; display: flex; flex-direction: column; }
    .scene { flex: 1; position: relative; min-height: 420px; overflow: hidden; background: #dcedea; }
    .landscape { position: absolute; width: 100%; height: 100%; inset: 0; }
    .masthead { position: absolute; inset: 36px 44px auto; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .eyebrow { margin: 0 0 7px; font-size: 10px; font-weight: 700; }
    h1 { margin: 0; font: 700 57px/1.04 Georgia, 'Times New Roman', serif; }
    .weather { padding-top: 2px; text-align: right; }
    .temperature { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 8px; font-size: 23px; }
    .weather small { font-size: 10px; }
    .scene-note { position: absolute; left: 44px; bottom: 27px; margin: 0; font: italic 18px Georgia, 'Times New Roman', serif; }
    .edition { position: absolute; right: 44px; bottom: 28px; font-size: 10px; font-weight: 700; }
    .toolbar { min-height: 96px; padding: 18px 44px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-top: 1px solid #24494320; }
    .ride-label { display: flex; align-items: center; gap: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e57b5e; box-shadow: 0 0 0 5px #e57b5e14; }
    .ride-label strong { display: block; font-size: 12px; margin-bottom: 5px; }
    .ride-label small { display: block; font-size: 10px; color: #61756f; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .icon-button { position: relative; width: 44px; height: 44px; padding: 11px; border-radius: 50%; border: 1px solid #cdd7cf; background: transparent; color: #244943; cursor: pointer; display: grid; place-items: center; }
    .icon-button:hover { background: #e8eee4; }
    .icon-button.primary { background: #244943; border-color: #244943; color: #fffef5; }
    .icon-button.primary:hover { background: #356157; }
    .icon-button::after { content: attr(aria-label); position: absolute; bottom: calc(100% + 11px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 7px 10px; border-radius: 4px; background: #244943; color: #fffef5; font-size: 11px; pointer-events: none; opacity: 0; }
    .icon-button:hover::after, .icon-button:focus-visible::after { opacity: 1; }
    :focus-visible { outline: 3px solid #ca634a; outline-offset: 5px; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .speed-control { display: flex; align-items: center; gap: 12px; margin-left: 9px; padding-left: 21px; border-left: 1px solid #d6ded5; }
    .speed-control label { font-size: 11px; }
    input[type="range"] { width: 105px; height: 28px; margin: 0; accent-color: #244943; cursor: pointer; }
    output { min-width: 35px; font-size: 11px; font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
    .outline { stroke: #294c46; stroke-linecap: round; stroke-linejoin: round; }
    .wheel-spin, .crank-spin { animation: spin 2s linear infinite; transform-origin: 0 0; }
    .pedal-level { animation: counter-spin 2s linear infinite; transform-origin: 0 0; }
    .far-phase { animation-delay: -1s; }
    .bike-bob { animation: bike-bob 1s ease-in-out infinite; }
    .pelican-body { animation: body-bob 1s ease-in-out infinite; transform-origin: 665px 515px; }
    .wing { animation: flap 2s ease-in-out infinite; transform-origin: 690px 424px; }
    .far-wing { animation: far-flap 2s ease-in-out infinite; transform-origin: 707px 409px; }
    .scarf-tail { animation: flutter 1s ease-in-out infinite; transform-origin: 756px 390px; }
    .leg { fill: none; stroke: #dfaa54; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; animation: pedal-leg 2s linear infinite; }
    .leg.far-phase { stroke: #bd8948; animation-delay: -1s; }
    .cloud-drift { animation: cloud-drift 48s linear infinite; }
    .cloud-drift.slow { animation-duration: 72s; animation-delay: -22s; }
    .waves { animation: wave-drift 8s linear infinite; }
    .waves.distant { animation-duration: 15s; animation-direction: reverse; }
    .road-marks { animation: road-drift 2s linear infinite; }
    .boat { animation: float 5s ease-in-out infinite; transform-origin: 313px 436px; }
    .flying-bird { animation: glide 6s ease-in-out infinite; }
    .grass { animation: sway 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .shadow { animation: shadow 1s ease-in-out infinite; transform-origin: 717px 765px; }
    [data-paused="true"] .scene * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes counter-spin { to { transform: rotate(-360deg); } }
    @keyframes bike-bob { 50% { transform: translateY(-2px); } }
    @keyframes body-bob { 50% { transform: translateY(-6px) rotate(-1deg); } }
    @keyframes flap { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-14deg); } }
    @keyframes far-flap { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(13deg); } }
    @keyframes flutter { 0%, 100% { transform: rotate(-4deg) scaleY(.94); } 50% { transform: rotate(6deg) scaleY(1.05); } }
    @keyframes cloud-drift { to { transform: translateX(-1440px); } }
    @keyframes wave-drift { to { transform: translateX(-240px); } }
    @keyframes road-drift { to { transform: translateX(-400px); } }
    @keyframes float { 50% { transform: translateY(5px) rotate(2deg); } }
    @keyframes glide { 50% { transform: translate(-14px, -9px); } }
    @keyframes sway { 50% { transform: rotate(4deg); } }
    @keyframes shadow { 50% { transform: scaleX(.97); opacity: .13; } }
    /* Eight crank positions keep both feet on the pedals; the far leg is half a turn ahead. */
    @keyframes pedal-leg {
      0%, 100% { d: path("M657 516 L741.5 552.3 L734 644"); }
      12.5% { d: path("M657 516 L724.8 578.2 L723.2 670.2"); }
      25% { d: path("M657 516 L711.5 590.1 L697 681"); }
      37.5% { d: path("M657 516 L713.5 588.6 L670.8 670.2"); }
      50% { d: path("M657 516 L724.6 578.5 L660 644"); }
      62.5% { d: path("M657 516 L739.5 556.6 L670.8 617.8"); }
      75% { d: path("M657 516 L747.9 530.3 L697 607"); }
      87.5% { d: path("M657 516 L748 529.3 L723.2 617.8"); }
    }
    @media (max-width: 640px) {
      .masthead { inset: 28px 24px auto; }
      h1 { font-size: 45px; }
      .temperature { font-size: 20px; }
      .cyclist-position { transform: scale(.78); transform-origin: 720px 680px; }
      .scene-note { left: 24px; bottom: 24px; font-size: 16px; }
      .edition { display: none; }
      .lighthouse { transform: translateX(-330px); }
      .sun { transform: translateX(-230px); }
      .boat-position { transform: translateX(205px); }
      .toolbar { min-height: 124px; padding: 17px 24px; flex-wrap: wrap; gap: 16px; }
      .ride-label { width: 100%; }
      .ride-label strong, .ride-label small { display: inline; margin: 0 9px 0 0; }
      .controls { width: 100%; gap: 10px; }
      .speed-control { margin-left: auto; padding-left: 14px; gap: 8px; }
      input[type="range"] { width: 82px; }
    }
    @media (max-width: 360px) {
      .toolbar { padding-inline: 18px; }
      .masthead { inset-inline: 18px; }
      h1 { font-size: 38px; }
      .weather small { display: none; }
      .speed-control { padding-left: 10px; gap: 6px; }
      input[type="range"] { width: 64px; }
      .cyclist-position { transform: scale(.68); }
    }
    @media (min-width: 1200px) and (min-aspect-ratio: 2/1) {
      .cyclist-position { transform: scale(.7); transform-origin: 720px 420px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .app:not([data-motion="allowed"]) .scene * { animation-play-state: paused !important; }
    }
  </style>

        <button class="icon-button primary" id="playback" type="button" aria-label="Pause animation">
          <svg class="icon pause-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
          <svg class="icon play-icon" aria-hidden="true" viewBox="0 0 24 24" hidden><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </button>
        <button class="icon-button" id="restart" type="button" aria-label="Restart animation"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/></svg></button>
        <div class="speed-control"><label for="speed">Pace</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="Animation speed" aria-valuetext="1 times speed"><output id="speed-value" for="speed">1&times;</output></div>
      </div>
    </footer>
  </main>
  <script>
    const app = document.querySelector('.app');
    const playback = document.querySelector('#playback');
    const speed = document.querySelector('#speed');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let paused = reducedMotion.matches;

    function updatePlayback() {
      app.dataset.paused = String(paused || document.hidden);
      playback.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
      document.querySelector('.pause-icon').toggleAttribute('hidden', paused);
      document.querySelector('.play-icon').toggleAttribute('hidden', !paused);
      document.querySelector('#ride-status').textContent = paused ? 'Taking a breather' : 'Enjoy the ride';
    }

    playback.addEventListener('click', () => {
      paused = !paused;
      app.dataset.motion = 'allowed';
      updatePlayback();
    });
    document.querySelector('#restart').addEventListener('click', () => {
      document.getAnimations().forEach(animation => { animation.currentTime = 0; });
    });
    speed.addEventListener('input', () => {
      const rate = Number(speed.value);
      document.getAnimations().forEach(animation => animation.updatePlaybackRate(rate));
      document.querySelector('#speed-value').textContent = rate + '\u00d7';
      speed.setAttribute('aria-valuetext', rate + ' times speed');
    });
    reducedMotion.addEventListener('change', event => {
      paused = event.matches;
      delete app.dataset.motion;
      updatePlayback();
    });
    document.addEventListener('visibilitychange', updatePlayback);
    updatePlayback();
  </script>
</body>
</html>
